<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#2c7a4b">
<title>Dziękuję – Stronodajnia</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;background:#2c7a4b;color:#fff;font-family:"Manrope",system-ui,sans-serif;padding:20px;text-align:center}
.box{max-width:520px}
.tick{width:72px;height:72px;border-radius:50%;background:#ffe27a;display:grid;place-items:center;margin:0 auto 22px}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;letter-spacing:-.03em;font-size:clamp(36px,7vw,52px);line-height:1.05;margin-bottom:12px}
p{font-size:18px;color:rgba(255,255,255,.88);margin-bottom:28px}
a{display:inline-block;background:#ffe27a;color:#13241b;text-decoration:none;font-weight:700;padding:15px 26px;border-radius:999px}
</style>
</head>
<body>
<div class="box">
  <div class="tick"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#13241b" stroke-width="2.6" stroke-linecap="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  <h1>Dziękuję, mam to!</h1>
  <p>Odezwę się zwykle tego samego dnia, a bezpłatny projekt przygotuję w 1–2 dni.</p>
  <a href="/">Wróć na stronę główną</a>
</div>
</body>
</html>
